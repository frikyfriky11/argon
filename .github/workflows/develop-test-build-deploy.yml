name: develop - Verify and private release
on:
  push:
    branches: [develop]
permissions:
  contents: read
  actions: read
concurrency:
  group: argon-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify
    runs-on: [self-hosted, Linux, X64, argon-build]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
          dest: ~/setup-pnpm-${{ runner.name }}
      - name: Verify all backend behavior
        run: dotnet test
      - name: Verify frontend behavior and runtime configuration
        working-directory: src/Argon.WebGui
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
  release:
    name: Private release
    needs: verify
    runs-on: [self-hosted, Linux, X64, argon-build]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      HOMELAB_DEPLOY_HOST: ${{ vars.HOMELAB_DEPLOY_HOST }}
      HOMELAB_DEPLOY_KNOWN_HOSTS: ${{ vars.HOMELAB_DEPLOY_KNOWN_HOSTS }}
      HOMELAB_DEPLOY_SSH_KEY: ${{ secrets.HOMELAB_DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: deploy the verified image set
        run: python3 tooling/release/deploy.py deploy --environment staging
      - name: Verify actual health, authentication and frontend configuration
        run: python3 tooling/release/smoke.py https://argon-test.previatozanirato.family staging
      - name: Accept the tested staging image set
        run: python3 tooling/release/deploy.py accept --environment staging
